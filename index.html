<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description" content="تطبيق ملاحظات بسيط وجميل يعمل بدون إنترنت" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="مذكرتي" />
  <title>مذكرتي | مينا منير فرج الله</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">📝</span>
        <div>
          <h1>مذكرتي</h1>
          <p class="subtitle">بواسطة مينا منير فرج الله</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="btn-icon" title="تبديل الوضع">🌙</button>
        <button id="exportBtn" class="btn-icon" title="تصدير الملاحظات">⬇️</button>
        <button id="importBtn" class="btn-icon" title="استيراد ملاحظات">⬆️</button>
        <input type="file" id="importFile" accept=".json" hidden />
      </div>
    </header>

    <!-- Search & Add -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث في الملاحظات..." />
        <span class="search-icon">🔍</span>
      </div>
      <button id="addNoteBtn" class="btn-primary">
        <span>+</span> ملاحظة جديدة
      </button>
    </div>

    <!-- Notes Grid -->
    <main class="notes-container" id="notesContainer">
      <!-- Notes will be rendered here -->
    </main>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗒️</div>
      <h2>لا توجد ملاحظات بعد</h2>
      <p>اضغط على "ملاحظة جديدة" لتبدأ في كتابة أفكارك</p>
    </div>
  </div>

  <!-- Modal for Add/Edit Note -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">ملاحظة جديدة</h2>
        <button class="btn-close" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="noteTitle" placeholder="عنوان الملاحظة..." maxlength="100" />
        <textarea id="noteContent" placeholder="اكتب ملاحظتك هنا..." rows="10"></textarea>
        <div class="color-picker">
          <span>اللون:</span>
          <button class="color-btn active" data-color="#fef3c7" style="background:#fef3c7"></button>
          <button class="color-btn" data-color="#d1fae5" style="background:#d1fae5"></button>
          <button class="color-btn" data-color="#dbeafe" style="background:#dbeafe"></button>
          <button class="color-btn" data-color="#fce7f3" style="background:#fce7f3"></button>
          <button class="color-btn" data-color="#e0e7ff" style="background:#e0e7ff"></button>
          <button class="color-btn" data-color="#ffedd5" style="background:#ffedd5"></button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelBtn">إلغاء</button>
        <button class="btn-primary" id="saveBtn">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
